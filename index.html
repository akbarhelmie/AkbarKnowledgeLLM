<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akbar's Advanced 3D Knowledge Graph</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Inter', sans-serif; background-color: #1a202c; }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(26, 32, 44, 0.85); /* Tailwind gray-900 with opacity */
            color: white;
            padding: 12px;
            border-radius: 8px;
            z-index: 100;
            font-size: 13px; /* Slightly smaller base font */
            max-width: 340px; 
            max-height: calc(100vh - 20px); /* Max height with padding */
            overflow-y: auto;
            border: 1px solid #4A5568; /* Tailwind gray-600 */
        }
        .info-section {
            margin-top: 0.75rem; /* mt-3 */
            padding-top: 0.75rem; /* pt-3 */
            border-top: 1px solid #4A5568; /* Tailwind gray-600 */
        }
        .info-section h2, #filter-section h2 {
            font-weight: 600; /* semibold */
            font-size: 0.9rem; /* Smaller heading */
            margin-bottom: 0.5rem; /* mb-2 */
            color: #63B3ED; /* Tailwind blue-400 */
        }
        .node-label {
            position: absolute;
            background: rgba(237, 242, 247, 0.9); /* Tailwind gray-200 with opacity */
            padding: 2px 5px;
            border-radius: 3px;
            font-size: 9px;
            color: #1A202C; /* Tailwind gray-900 */
            pointer-events: none;
            white-space: nowrap;
            transform: translate(-50%, -50%);
            text-align: center;
            border: 1px solid #A0AEC0; /* Tailwind gray-500 */
        }
        .edge-relation-label {
            background: rgba(45, 55, 72, 0.85); /* Tailwind gray-700 with opacity */
            color: #E2E8F0; /* Tailwind gray-300 */
            padding: 2px 4px;
            font-size: 8px;
            cursor: pointer;
            pointer-events: auto !important;
            border: 1px solid #718096; /* Tailwind gray-500 */
        }
        #filter-section label {
            display: block;
            margin-bottom: 4px;
            font-size: 0.8rem;
            cursor: pointer;
        }
        #filter-section input[type="checkbox"] {
            margin-right: 6px;
            accent-color: #63B3ED; /* Tailwind blue-400 */
        }
        #node-inspector-display p, #node-inspector-display ul, #definition-text {
            font-size: 0.8rem; 
        }
        #node-inspector-display ul {
            list-style-type: disc;
            padding-left: 1.25rem; /* Roughly ml-5 */
        }
         #node-inspector-display strong {
            color: #A0AEC0; /* Tailwind gray-400 */
        }
    </style>
</head>
<body>
    <div id="info">
        <h1 class="font-bold text-md mb-2">Akbar's Advanced Knowledge Graph</h1>
        <div class="text-xs mb-3">
            <p><strong>Interact:</strong> L-Click+Drag (Rotate), R-Click+Drag (Pan), Scroll (Zoom).</p>
            <p>Click nodes or edge labels for details. Node size indicates connectivity.</p>
        </div>
        
        <div id="filter-section">
            <h2>Filter by Node Type:</h2>
            <div id="type-filters" class="grid grid-cols-2 gap-x-2"></div>
        </div>

        <div id="node-inspector-display" class="info-section" style="display:none;">
            <h2 id="node-inspector-title">Node Details:</h2>
            <p><strong>ID:</strong> <span id="node-id-text"></span></p>
            <p><strong>Type:</strong> <span id="node-type-text"></span></p>
            <p><strong>Connections:</strong> <span id="node-degree-text"></span></p>
            <div id="node-connections-details" style="display:none;">
                <p class="mt-1"><strong>Direct Relations:</strong></p>
                <ul id="node-connections-list" class="max-h-32 overflow-y-auto"></ul>
            </div>
        </div>

        <div id="definition-display" class="info-section" style="display:none;">
            <h2 id="edge-definition-title">Relationship Details:</h2>
            <p id="definition-text"></p>
        </div>
    </div>

        let scene, camera, renderer, labelRenderer, controls, raycaster, mouse;
        const nodeMeshes = new Map(); // Stores node mesh by ID
        const edgeLines = []; // Stores all edge lines and their labels
        const nodeDataMap = new Map(); // Stores node data by ID, including degree
        const nodeDegrees = {}; // Stores node degrees { nodeId: degreeCount }

        // Filter state
        const typeFilterState = {};

        // DOM Elements
        const typeFiltersContainer = document.getElementById('type-filters');
        const nodeInspectorDisplay = document.getElementById('node-inspector-display');
        const nodeIdText = document.getElementById('node-id-text');
        const nodeTypeText = document.getElementById('node-type-text');

        const edgeDefinitionText = document.getElementById('definition-text');

        function calculateNodeDegrees() {
            graphData.nodes.forEach(n => nodeDegrees[n.id] = 0);
            graphData.edges.forEach(e => {
                if (nodeDegrees[e.source] !== undefined) nodeDegrees[e.source]++;
                if (nodeDegrees[e.target] !== undefined) nodeDegrees[e.target]++;
            });
        }
        
        function initFilters() {
            const uniqueTypes = [...new Set(graphData.nodes.map(n => n.type || 'default'))];
            uniqueTypes.sort().forEach(type => {
                typeFilterState[type] = true; // Initially all visible
                const label = document.createElement('label');
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = true;
                checkbox.dataset.type = type;
                checkbox.addEventListener('change', applyFilters);
                label.appendChild(checkbox);
                label.appendChild(document.createTextNode(type.replace(/_/g, ' ')));
                typeFiltersContainer.appendChild(label);
            });
        }

        function applyFilters() {
            // Update filter state from checkboxes
            typeFiltersContainer.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                typeFilterState[cb.dataset.type] = cb.checked;
            });

            // Update node visibility
            nodeMeshes.forEach((nodeMesh, id) => {
                const nodeData = nodeDataMap.get(id);
                const isVisible = typeFilterState[nodeData.type || 'default'];
                nodeMesh.visible = isVisible;
                if (nodeMesh.userData.label) nodeMesh.userData.label.visible = isVisible;
            });

            // Update edge visibility
            edgeLines.forEach(edgeObj => {
                const sourceNode = nodeDataMap.get(edgeObj.sourceId);
                const targetNode = nodeDataMap.get(edgeObj.targetId);
                const sourceVisible = typeFilterState[sourceNode.type || 'default'];
                const targetVisible = typeFilterState[targetNode.type || 'default'];
                const edgeIsVisible = sourceVisible && targetVisible;
                
                edgeObj.line.visible = edgeIsVisible;
                if (edgeObj.label) edgeObj.label.visible = edgeIsVisible;
            });
        }


        function init() {
            calculateNodeDegrees();
            initFilters();

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1A202C); // Tailwind gray-900
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1500); // Increased far plane
            camera.position.z = 70; // Start a bit further out

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            labelRenderer = new THREE.CSS2DRenderer();
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.domElement.style.position = 'absolute';
            labelRenderer.domElement.style.top = '0px';
            document.body.appendChild(labelRenderer.domElement);

            controls = new THREE.OrbitControls(camera, labelRenderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 10; // Allow closer zoom
            controls.maxDistance = 300; // Allow further zoom out

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            const ambientLight = new THREE.AmbientLight(0xE2E8F0, 0.9); // Tailwind gray-300
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xFFFFFF, 1.2); // Brighter
            directionalLight.position.set(2, 2, 2).normalize();
            scene.add(directionalLight);

            const baseNodeRadius = 1.0;
            const minNodeScale = 0.8;
            const maxNodeScale = 2.5;
            const degrees = Object.values(nodeDegrees);
            const minDegree = Math.min(...degrees, 0); // Ensure minDegree is not Infinity if no nodes/edges
            const maxDegree = Math.max(...degrees, 1); // Ensure maxDegree is at least 1

            graphData.nodes.forEach(nd => {
                nodeDataMap.set(nd.id, nd);
                const nodeType = nd.type || 'default';
                const color = nodeColors[nodeType] || nodeColors['default'];
                const material = new THREE.MeshLambertMaterial({ color: color });
                
                const degree = nodeDegrees[nd.id] || 0;
                let scale = minNodeScale;
                if (maxDegree > minDegree) { // Avoid division by zero if all nodes have same degree
                    scale = minNodeScale + ((degree - minDegree) / (maxDegree - minDegree)) * (maxNodeScale - minNodeScale);
                } else if (maxDegree > 0) { // If all nodes have same degree > 0
                     scale = (minNodeScale + maxNodeScale) / 2;
                }
                scale = Math.max(minNodeScale, Math.min(scale, maxNodeScale)); // Clamp scale


                const nodeGeometry = new THREE.SphereGeometry(baseNodeRadius, 32, 32);
                const nodeMesh = new THREE.Mesh(nodeGeometry, material);
                nodeMesh.scale.set(scale, scale, scale);

                nodeMesh.position.set(
                    (Math.random() - 0.5) * 100, // Wider initial spread
                    (Math.random() - 0.5) * 100,
                    (Math.random() - 0.5) * 100
                );
                nodeMesh.userData = { id: nd.id, type: nd.type, originalData: nd, degree: degree, baseScale: scale };
                scene.add(nodeMesh);
                nodeMeshes.set(nd.id, nodeMesh);

                const labelDiv = document.createElement('div');
                labelDiv.className = 'node-label';
                labelDiv.textContent = (nd.displayText || nd.id).replace(/_/g, ' ');
                const label = new
