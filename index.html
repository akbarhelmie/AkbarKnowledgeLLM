<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akbar's Combined 3D Knowledge Graph</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Inter', sans-serif; background-color: #1a202c; }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            border-radius: 8px;
            z-index: 100;
            font-size: 14px;
            max-width: 300px;
        }
        .node-label { /* Used for both node IDs and edge relations */
            position: absolute;
            background: rgba(255, 255, 255, 0.85);
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 10px; /* Slightly smaller for potentially more labels */
            color: #2c3e50; /* Darker text for better readability on light background */
            pointer-events: none;
            white-space: nowrap;
            transform: translate(-50%, -50%);
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="info" class="rounded-lg shadow-lg">
        <h1 class="font-bold text-lg mb-2">Akbar's Combined 3D Knowledge Graph</h1>
        <p>Use your mouse to interact:</p>
        <ul class="list-disc list-inside ml-4">
            <li><strong>Left-click & Drag:</strong> Rotate the graph</li>
            <li><strong>Right-click & Drag:</strong> Pan the graph</li>
            <li><strong>Scroll Wheel:</strong> Zoom in/out</li>
        </ul>
        <p class="mt-2">Nodes are colored by type. Edges show relationships.</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>

                // Additional Nodes (extraNodes)
                { id: "Progressive_Citizenship_Foundation", type: "Foundation" },
                { id: "Financial_Literacy", type: "Value" },
                { id: "Dividend_Staking", type: "Finance_Value" }, // Distinct from Dividend_Staking_Lifestyle
                { id: "Sustainable_Economy", type: "Goal" },
                { id: "Sustainable_Agriculture", type: "Goal" },
                { id: "Welfare_Priority", type: "Policy" },
                { id: "No_Tax_Policy", type: "Policy" },
                { id: "Financial_Independence", type: "Finance_Value" },
                { id: "Universal_Prosperity", type: "Goal" },
                { id: "Bureaucratic_Stagnation", type: "Challenge" }
            ],
            "edges": [
                // Original Edges from index.html
                { "source": "Akbar", "target": "Legal_Entrepreneurship", "relation": "operates_in" },
                { "source": "Akbar", "target": "Legal_Tech", "relation": "operates_in" },
                { "source": "Akbar", "target": "Venture_Capital", "relation": "operates_in" },
                { "source": "Akbar", "target": "Legal_Tech_Innovation", "relation": "operates_in" },
                { "source": "Akbar", "target": "Human_Rights_Law", "relation": "has_expertise_in" },
                { "source": "Akbar", "target": "Dividend_Staking_Lifestyle", "relation": "pursues" },
                { "source": "Dividend_Staking_Lifestyle", "target": "Dividends_Income", "relation": "is_characterized_by" },
                { "source": "Dividend_Staking_Lifestyle", "target": "Staking_Rewards", "relation": "is_characterized_by" },
                { "source": "Akbar", "target": "Crypto_Investing", "relation": "involved_in" },

                { "source": "Akbar", "target": "Investment_Capital", "relation": "manages" },

                { "source": "Hedge_Funds", "target": "Global_Strategies", "relation": "utilizes" },
                { "source": "Sovereign_Wealth_Funds", "target": "Hedge_Funds", "relation": "can_invest_in" },
                { "source": "Venture_Capital", "target": "Investment_Capital", "relation": "is_a_form_of" },
                { "source": "Legal_Tech_Innovation", "target": "Venture_Capital", "relation": "attracts" },
                { "source": "Akbar", "target": "Global_Strategies", "relation": "applies" },
                { "source": "Akbar", "target": "Legal_Reformation", "relation": "believes_in" },
                { "source": "Akbar", "target": "Adaptability", "relation": "exhibits" },
                { "source": "Akbar", "target": "Creativity", "relation": "exhibits" },
                { "source": "Akbar", "target": "Proactiveness", "relation": "exhibits" },
                { "source": "Akbar", "target": "Progressivism", "relation": "believes_in" },
                { "source": "Akbar", "target": "Unbiased_Politics", "relation": "influenced_by" },
                { "source": "Akbar", "target": "Nation's_Best", "relation": "aspires_to_be" },
                { "source": "Nation's_Best", "target": "World_Government", "relation": "represents_in" },
                { "source": "Akbar", "target": "Pacifist_Philanthropist", "relation": "identifies_as" },
                { "source": "Akbar", "target": "Crab_Mentality", "relation": "seeks_to_eradicate" },
                { "source": "Akbar", "target": "Inferiority_Complex", "relation": "seeks_to_eradicate" },
                { "source": "Akbar", "target": "Equal_Access", "relation": "advocates_for" },
                { "source": "Equal_Access", "target": "Global_Citizenship", "relation": "enables" },
                { "source": "Akbar", "target": "Global_Citizenship", "relation": "supports" },

                // Additional Edges (extraEdges)
                { source: "Akbar", target: "Progressive_Citizenship_Foundation", relation: "founded", color: 0x32CD32 },
                { source: "Progressive_Citizenship_Foundation", target: "Financial_Literacy", relation: "teaches", color: 0x32CD32 },
                { source: "Progressive_Citizenship_Foundation", target: "Dividend_Staking", relation: "promotes", color: 0x32CD32 },
                { source: "Progressive_Citizenship_Foundation", target: "Sustainable_Economy", relation: "supports", color: 0x32CD32 },
                { source: "Progressive_Citizenship_Foundation", target: "Sustainable_Agriculture", relation: "supports", color: 0x32CD32 },
                { source: "Progressive_Citizenship_Foundation", target: "Welfare_Priority", relation: "prioritizes", color: 0x32CD32 },
                { source: "Progressive_Citizenship_Foundation", target: "No_Tax_Policy", relation: "proposes", color: 0x32CD32 },
                { source: "Progressive_Citizenship_Foundation", target: "Financial_Independence", relation: "empowers", color: 0x32CD32 },
                { source: "Financial_Independence", target: "Universal_Prosperity", relation: "leads_to", color: 0x32CD32 },
                { source: "Akbar", target: "Bureaucratic_Stagnation", relation: "despises", color: 0xDC143C }
            ]
        };

        const nodeColors = {
            // Original Colors
            "Person": 0xFF6347,             // Tomato
            "Domain": 0x6A5ACD,             // SlateBlue
            "Financial_Concept": 0xFFD700,  // Gold
            "Financial_Vehicle": 0x32CD32,  // LimeGreen
            "Strategy": 0x8A2BE2,          // BlueViolet
            "Lifestyle": 0xFF69B4,         // HotPink
            "Income_Stream": 0x00CED1,      // DarkTurquoise
            "Financial_Activity": 0xFFA500, // Orange
            "Ideology": 0x00BFFF,          // DeepSkyBlue
            "Value": 0x7CFC00,              // LawnGreen
            "Aspirational": 0xFF8C00,      // DarkOrange
            "Challenge": 0xDC143C,          // Crimson
            "Goal": 0x20B2AA,               // LightSeaGreen
            "default": 0xA9A9A9,            // DarkGray

            // New Type Colors
            "Foundation": 0x4682B4,         // SteelBlue
            "Finance_Value": 0xFFD700,      // Gold (Same as Financial_Concept, intentional)
            "Policy": 0xFFA07A              // LightSalmon
        };

        let scene, camera, renderer, labelRenderer, controls;
        const nodes = new Map();
        const nodeMeshes = []; // For force-directed layout if needed later, or for easier access

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a202c);
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 50; // Original Z position

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            labelRenderer = new THREE.CSS2DRenderer();
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.domElement.style.position = 'absolute';
            labelRenderer.domElement.style.top = '0px';
            // labelRenderer.domElement.style.pointerEvents = 'none'; // Keep pointer events for OrbitControls on this element
            document.body.appendChild(labelRenderer.domElement);

            controls = new THREE.OrbitControls(camera, labelRenderer.domElement); // Controls on labelRenderer.domElement
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.screenSpacePanning = false; // Original setting
            controls.minDistance = 5;  // Adjusted for potentially denser graph
            controls.maxDistance = 150; // Adjusted for potentially denser graph

            const ambientLight = new THREE.AmbientLight(0xcccccc, 0.7); // Slightly increased ambient light
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.9); // Slightly increased directional
            directionalLight.position.set(1, 1, 1).normalize();
            scene.add(directionalLight);

            const nodeGeometry = new THREE.SphereGeometry(1.5, 32, 32); // Original size
            graphData.nodes.forEach(nodeData => {
                const nodeType = nodeData.type || 'default';
                const color = nodeColors[nodeType] || nodeColors['default'];
                const material = new THREE.MeshLambertMaterial({ color: color });
                const nodeMesh = new THREE.Mesh(nodeGeometry, material);
                nodeMesh.position.set(
                    (Math.random() - 0.5) * 60, // Increased spread for more nodes
                    (Math.random() - 0.5) * 60,
                    (Math.random() - 0.5) * 60
                );
                scene.add(nodeMesh);
                nodes.set(nodeData.id, nodeMesh);
                nodeMeshes.push(nodeMesh);

                const labelDiv = document.createElement('div');
                labelDiv.className = 'node-label';
                labelDiv.textContent = nodeData.id.replace(/_/g, ' '); // Replace underscores for readability
                const label = new THREE.CSS2DObject(labelDiv);
                label.position.copy(nodeMesh.position);
                // Offset label slightly above the node
                label.position.y += 2.5; // Adjust as needed
                scene.add(label);
                nodeMesh.userData.label = label; // Link label for dynamic updates if needed
            });

            graphData.edges.forEach(edgeData => {
                const sourceNode = nodes.get(edgeData.source);
                const targetNode = nodes.get(edgeData.target);
                if (sourceNode && targetNode) {
                    const points = [sourceNode.position, targetNode.position];
                    const edgeGeometry = new THREE.BufferGeometry().setFromPoints(points);
                    const edgeMaterial = new THREE.LineBasicMaterial({ 
                        color: edgeData.color || 0xAAAAAA, // Default edge color slightly lighter
                        transparent: true,
                        opacity: 0.7 // Make edges slightly transparent
                    });
                    const edge = new THREE.Line(edgeGeometry, edgeMaterial);
                    scene.add(edge);

                    // Add edge relation label
                    if (edgeData.relation) {
                        const midpoint = new THREE.Vector3().addVectors(sourceNode.position, targetNode.position).multiplyScalar(0.5);
                        const relationLabelDiv = document.createElement('div');
                        relationLabelDiv.className = 'node-label'; // Using same class, could be different
                        relationLabelDiv.style.background = 'rgba(50, 50, 50, 0.7)'; // Darker background for edge labels
                        relationLabelDiv.style.color = '#E0E0E0'; // Lighter text for edge labels
                        relationLabelDiv.style.padding = '2px 4px';
                        relationLabelDiv.style.fontSize = '9px';
                        relationLabelDiv.textContent = edgeData.relation.replace(/_/g, ' ');
                        const relationLabel = new THREE.CSS2DObject(relationLabelDiv);
                        relationLabel.position.copy(midpoint);
                        scene.add(relationLabel);
                        // Store references if dynamic updates are needed
                        edge.userData.label = relationLabel; 
                        sourceNode.userData.label.userData = sourceNode.userData.label.userData || {};
                        sourceNode.userData.label.userData.edgeLabels = sourceNode.userData.label.userData.edgeLabels || [];
                        sourceNode.userData.label.userData.edgeLabels.push(relationLabel);
                        targetNode.userData.label.userData = targetNode.userData.label.userData || {};
                        targetNode.userData.label.userData.edgeLabels = targetNode.userData.label.userData.edgeLabels || [];
                        targetNode.userData.label.userData.edgeLabels.push(relationLabel);
                    }
                }
            });

            window.addEventListener('resize', onWindowResize, false);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            // Optional: Make labels follow nodes more smoothly if nodes were animated/moved
            nodes.forEach((nodeMesh, id) => {
                if (nodeMesh.userData.label) {
                    nodeMesh.userData.label.position.copy(nodeMesh.position);
                    nodeMesh.userData.label.position.y += 2.5; // Keep offset
                }
            });
             // Optional: Update edge labels if nodes move (more complex if edges also need redrawing)
            graphData.edges.forEach(edgeData => {
                const sourceNode = nodes.get(edgeData.source);
                const targetNode = nodes.get(edgeData.target);
                const edgeLine = scene.children.find(child => 
                    child.type === 'Line' &&
                    child.geometry.attributes.position &&
                    sourceNode && targetNode &&
                    child.geometry.attributes.position.array[0] === sourceNode.position.x &&
                    child.geometry.attributes.position.array[1] === sourceNode.position.y &&
                    child.geometry.attributes.position.array[3] === targetNode.position.x &&
                    child.geometry.attributes.position.array[4] === targetNode.position.y
                );
                if (edgeLine && edgeLine.userData.label) {
                    const midpoint = new THREE.Vector3().addVectors(sourceNode.position, targetNode.position).multiplyScalar(0.5);
                    edgeLine.userData.label.position.copy(midpoint);
                }
            });


            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }

        window.onload = function() {
            init();
            animate();
        };
    </script>
</body>
</html>
