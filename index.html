<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akbar's 3D Knowledge Graph (Reverted)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Inter', sans-serif; background-color: #1a202c; }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.75);
            color: white;
            padding: 12px; /* Increased padding slightly */
            border-radius: 8px;
            z-index: 100;
            font-size: 13px; /* Adjusted base font size */
            max-width: 330px; /* Adjusted max width */
            max-height: calc(100vh - 20px); 
            overflow-y: auto;
            border: 1px solid #4A5568; /* Added a subtle border */
        }
        .info-section { /* For consistent spacing of inspector/definition panels */
            margin-top: 0.75rem; 
            padding-top: 0.75rem; 
            border-top: 1px solid #4A5568; 
        }
        .info-section h2 {
            font-weight: 600; 
            font-size: 1rem; 
            margin-bottom: 0.25rem; 
            color: #90cdf4; 
        }
        .node-label {
            position: absolute;
            background: rgba(255, 255, 255, 0.85);
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 10px;
            color: #2c3e50;
            pointer-events: none;
            white-space: nowrap;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        .edge-relation-label {
            background: rgba(60, 60, 60, 0.75);
            color: #E8E8E8;
            padding: 2px 5px;
            font-size: 9px;
            cursor: pointer;
            pointer-events: auto !important;
        }
        #node-inspector-display p, #node-inspector-display ul, #definition-text { /* Target paragraphs and lists in inspector */
            font-size: 0.875rem; /* Tailwind text-sm */
        }
        #node-inspector-display ul {
            list-style-type: disc;
            padding-left: 1.5rem; /* Tailwind ml-6 equivalent */
        }
         #node-inspector-display strong { /* Make property names slightly distinct */
            color: #a0aec0; /* Tailwind gray-400 */
        }
    </style>
</head>
<body>
    <div id="info">
        <h1 class="font-bold text-lg mb-2">Akbar's 3D Knowledge Graph</h1>
        <p class="text-sm">Use your mouse to interact:</p>
        <ul class="list-disc list-inside ml-4 mb-2 text-sm">
            <li><strong>Left-click & Drag:</strong> Rotate</li>
            <li><strong>Right-click & Drag:</strong> Pan</li>
            <li><strong>Scroll Wheel:</strong> Zoom</li>
        </ul>
        <p class="text-sm">Click node spheres or edge labels for details.</p>
        
        <div id="node-inspector-display" class="info-section" style="display:none;">
            <h2 id="node-inspector-title">Node Details:</h2>
            <p><strong>ID:</strong> <span id="node-id-text"></span></p>
            <p><strong>Type:</strong> <span id="node-type-text"></span></p>
            <div id="node-connections-details" style="display:none;">
                <p class="mt-1"><strong>Direct Connections:</strong></p>
                <ul id="node-connections-list" class="max-h-40 overflow-y-auto"></ul>
            </div>
        </div>

        <div id="definition-display" class="info-section" style="display:none;">
            <h2 id="edge-definition-title">Relationship Details:</h2>
            <p id="definition-text"></p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>
