    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Inter', sans-serif; background-color: #1a202c; }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.75);
            color: white;
            padding: 10px;
            border-radius: 8px;
            z-index: 100;
            font-size: 14px;
            max-width: 320px;
            max-height: 95vh;
            overflow-y: auto;
        }
        .node-label {
            position: absolute;
            background: rgba(255, 255, 255, 0.85);
            padding: 3px 6px;
            border-radius: 4px;
            /* font-size will be set dynamically */
            color: #2c3e50;
            pointer-events: none;
            white-space: nowrap;
            transform: translate(-50%, -100%); /* Adjust transform for better positioning above node */
            text-align: center;
        }
        .edge-relation-label {
            background: rgba(60, 60, 60, 0.75);
            color: #E8E8E8;
            padding: 2px 5px;
            font-size: 9px; /* Can also be made proportional or fixed */
            cursor: pointer;
            pointer-events: auto !important;
        }
        #definition-display h2 {
            color: #90cdf4;
        }
    </style>
</head>

        <p>Use your mouse to interact:</p>
        <ul class="list-disc list-inside ml-4 mb-2">
            <li><strong>Left-click & Drag:</strong> Rotate</li>
            <li><strong>Right-click & Drag:</strong> Pan</li>
            <li><strong>Scroll Wheel:</strong> Zoom</li>
        </ul>
        <p class="text-sm">Nodes sized by connections. Click edge labels for details.</p>
        
        <div id="definition-display" class="mt-3 pt-3 border-t border-gray-600" style="display:none;">
            <h2 class="font-semibold text-md mb-1">Relationship Details:</h2>
            <p id="definition-text" class="text-sm"></p>
        </div>
    </div>

                { "source": "Progressive_Citizenship_Foundation", "target": "Financial_Literacy", "relation": "teaches", "color": 0x32CD32 },
                { "source": "Progressive_Citizenship_Foundation", "target": "Dividend_Staking", "relation": "promotes", "color": 0x32CD32 },
                { "source": "Progressive_Citizenship_Foundation", "target": "Sustainable_Economy", "relation": "supports", "color": 0x32CD32 },
                { "source": "Progressive_Citizenship_Foundation", "target": "Sustainable_Agriculture", "relation": "supports", "color": 0x32CD32 },
                { "source": "Progressive_Citizenship_Foundation", "target": "Welfare_Priority", "relation": "prioritizes", "color": 0x32CD32 },
                { "source": "Progressive_Citizenship_Foundation", "target": "No_Tax_Policy", "relation": "proposes", "color": 0x32CD32 },
                { "source": "Progressive_Citizenship_Foundation", "target": "Financial_Independence", "relation": "empowers", "color": 0x32CD32 },
                { "source": "Financial_Independence", "target": "Universal_Prosperity", "relation": "leads_to", "color": 0x32CD32 },
                { "source": "Akbar", "target": "MBTI_ENFJ", "relation": "is_mbti_type", "color": 0x87CEEB, "definition": "Akbar's Myers-Briggs Type Indicator is ENFJ (Protagonist), with a 51% Extroverted, 49% Introverted tendency, suggesting a nuanced expression of this type." }
            ]
        };

        const nodeColors = {
            "Person": 0xFF6347, "Domain": 0x6A5ACD, "Financial_Concept": 0xFFD700,
            "Financial_Vehicle": 0x32CD32, "Strategy": 0x8A2BE2, "Lifestyle": 0xFF69B4,
            "Income_Stream": 0x00CED1, "Financial_Activity": 0xFFA500, "Ideology": 0x00BFFF,
            "Value": 0x7CFC00, "Aspirational": 0xFF8C00, "Challenge": 0xDC143C,
            "Goal": 0x20B2AA, "default": 0xA9A9A9,
            "Foundation": 0x4682B4, "Finance_Value": 0xFFD700, "Policy": 0xFFA07A,
            "Personality_Trait": 0x87CEEB
        };

        let scene, camera, renderer, labelRenderer, controls;
        const nodes = new Map();
        
        const definitionDisplay = document.getElementById('definition-display');
        const definitionText = document.getElementById('definition-text');

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a202c);
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 60; // Adjusted for potentially larger scaled nodes

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            labelRenderer = new THREE.CSS2DRenderer();
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.domElement.style.position = 'absolute';
            labelRenderer.domElement.style.top = '0px';
            document.body.appendChild(labelRenderer.domElement);

            controls = new THREE.OrbitControls(camera, labelRenderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.screenSpacePanning = false;
            controls.minDistance = 10; // Adjusted
            controls.maxDistance = 200; // Adjusted

            const ambientLight = new THREE.AmbientLight(0xcccccc, 0.8); // Brighter ambient
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0); // Brighter directional
            directionalLight.position.set(1.5, 1.5, 1.5).normalize();
            scene.add(directionalLight);

            // --- Calculate Node Degrees for Proportional Sizing ---
            const degrees = {};
            graphData.nodes.forEach(node => { degrees[node.id] = 0; });
            graphData.edges.forEach(edge => {
                if (degrees[edge.source] !== undefined) degrees[edge.source]++;
                if (degrees[edge.target] !== undefined) degrees[edge.target]++;
            });

            const allDegrees = Object.values(degrees).filter(d => d >= 0); // Include nodes with 0 degree for min
            const minDegree = allDegrees.length > 0 ? Math.min(...allDegrees) : 0;
            const maxDegree = allDegrees.length > 0 ? Math.max(...allDegrees) : 0;
            // --- End Degree Calculation ---

            const baseSphereRadius = 1.5; // Original sphere radius
            const nodeGeometry = new THREE.SphereGeometry(baseSphereRadius, 32, 32);

            graphData.nodes.forEach(nodeData => {
                const nodeType = nodeData.type || 'default';
                const color = nodeColors[nodeType] || nodeColors['default'];
                const material = new THREE.MeshLambertMaterial({ color: color });
                const nodeMesh = new THREE.Mesh(nodeGeometry.clone(), material); // Clone geometry for independent scaling
                
                nodeMesh.position.set(
                    (Math.random() - 0.5) * 80, 
                    (Math.random() - 0.5) * 80,
                    (Math.random() - 0.5) * 80
                );

                // --- Apply Proportional Node Scaling ---
                const degree = degrees[nodeData.id] || 0;
                const baseNodeScale = 1.0;
                const minNodeSF = 0.6; // Scale Factor for min degree
                const maxNodeSF = 2.2; // Scale Factor for max degree
                let nodeScaleFactor = baseNodeScale;

                if (maxDegree > minDegree) {
                    nodeScaleFactor = minNodeSF + ((degree - minDegree) / (maxDegree - minDegree)) * (maxNodeSF - minNodeSF);
                } else if (degree > 0) { // All nodes have same degree > 0 or only one connected node type
                    nodeScaleFactor = 1.2 * baseNodeScale;
                } else { // Isolated node (degree 0)
                     nodeScaleFactor = 0.5 * baseNodeScale;
                }
                nodeScaleFactor = Math.max(minNodeSF, Math.min(maxNodeSF, nodeScaleFactor)); // Clamp
                nodeMesh.scale.set(nodeScaleFactor, nodeScaleFactor, nodeScaleFactor);
                // --- End Proportional Node Scaling ---

                scene.add(nodeMesh);
                nodes.set(nodeData.id, nodeMesh);

                const labelDiv = document.createElement('div');
                labelDiv.className = 'node-label';
                labelDiv.textContent = (nodeData.displayText || nodeData.id).replace(/_/g, ' ');
                
                // --- Apply Proportional Label Font Size ---
                const minLabelFS = 7; // Font Size
                const maxLabelFS = 16; // Font Size
                let labelFontSize = 10; // Default
                 if (maxDegree > minDegree) {
                    labelFontSize = minLabelFS + ((degree - minDegree) / (maxDegree - minDegree)) * (maxLabelFS - minLabelFS);
                } else if (degree > 0) {
                     labelFontSize = 11;
                } else {
                    labelFontSize = 7;
                }
                labelDiv.style.fontSize = Math.max(minLabelFS, Math.min(maxLabelFS, labelFontSize)) + 'px';
                // --- End Proportional Label Font Size ---

                const label = new THREE.CSS2DObject(labelDiv);
                label.position.copy(nodeMesh.position);
                // Adjust label Y-offset based on scaled node radius
                label.position.y += (baseSphereRadius * nodeScaleFactor) + 0.8; // Offset slightly above the scaled node
                scene.add(label);
                nodeMesh.userData.label = label;
            });

            graphData.edges.forEach((edgeData, index) => {
                const sourceNode = nodes.get(edgeData.source);
                const targetNode = nodes.get(edgeData.target);
                if (sourceNode && targetNode) {
                    const sourcePos = sourceNode.position;
                    const targetPos = targetNode.position;
                    const edgeColor = edgeData.color || 0xAAAAAA;
                    const edgeMaterial = new THREE.LineBasicMaterial({ 
                        color: edgeColor,
                        transparent: true,
                        opacity: 0.65 // Slightly reduced opacity for curves
                    });

                    // --- Create Curved Edge ---
                    const distance = sourcePos.distanceTo(targetPos);
                    const midPoint = new THREE.Vector3().addVectors(sourcePos, targetPos).multiplyScalar(0.5);
                    
                    const normal = new THREE.Vector3().subVectors(targetPos, sourcePos).normalize();
                    let controlOffsetDirection;
                    // Create a stable perpendicular vector for control point offset
                    if (Math.abs(normal.z) < 0.99) { // If not largely aligned with Z axis
                        controlOffsetDirection = new THREE.Vector3().crossVectors(normal, new THREE.Vector3(0,0,1)).normalize();
                    } else { // largely aligned with Z, use X or Y axis for cross product
                         controlOffsetDirection = new THREE.Vector3().crossVectors(normal, new THREE.Vector3(0,1,0)).normalize();
                    }

                    const curveBowFactor = Math.min(distance * 0.2, 12); // Adjust bow amount
                    const bowDirection = (index % 2 === 0) ? 1 : -1; // Alternate bow for parallel edges
                    
                    const controlPoint = new THREE.Vector3().copy(midPoint)
                                          .addScaledVector(controlOffsetDirection, curveBowFactor * bowDirection);

                    const curve = new THREE.QuadraticBezierCurve3(sourcePos, controlPoint, targetPos);
                    const curvePoints = curve.getPoints(20); // Number of segments
                    const curveGeometry = new THREE.BufferGeometry().setFromPoints(curvePoints);
                    const edge = new THREE.Line(curveGeometry, edgeMaterial);
                    scene.add(edge);
                    // --- End Curved Edge ---

                    if (edgeData.relation) {
                        const curveMidpoint = curve.getPoint(0.5); // Get point on curve for label
                        const relationLabelDiv = document.createElement('div');
                        relationLabelDiv.className = 'node-label edge-relation-label';
                        relationLabelDiv.textContent = edgeData.relation.replace(/_/g, ' ');
                        
                        relationLabelDiv.addEventListener('click', () => {
                            if (edgeData.definition) {
                                definitionText.innerHTML = edgeData.definition.replace(/\n/g, '<br>');
                                definitionDisplay.style.display = 'block';
                            } else {
                                definitionText.textContent = 'No specific details available for this relationship.';
                                definitionDisplay.style.display = 'block';
                            }
                        });

                        const relationLabel = new THREE.CSS2DObject(relationLabelDiv);
                        relationLabel.position.copy(curveMidpoint);
                        scene.add(relationLabel);
                        edge.userData.label = relationLabel; 
                    }
                }
            });

            window.addEventListener('resize', onWindowResize, false);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            // Update node label positions if nodes were moving (they are static in this setup after init)
            nodes.forEach((nodeMesh) => {
                if (nodeMesh.userData.label) {
                    nodeMesh.userData.label.position.copy(nodeMesh.position);
                    nodeMesh.userData.label.position.y += (1.5 * nodeMesh.scale.y) + 0.8; // baseSphereRadius is 1.5
                }
            });
            
            // Edge labels are CSS2DObjects positioned on curves; if nodes don't move, curves don't change.
            // If nodes were dynamic, edge curves and their labels would need full recalculation.

            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }

        window.onload = function() {
            init();
            animate();
        };
    </script>
